<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Tests</title>
<style>body{font:15px system-ui;padding:16px}.ok{color:#16a34a}.ko{color:#dc2626;font-weight:700}</style></head>
<body>
<h1 id="sum">Tests…</h1>
<ul id="out"></ul>
<script type="module">
import * as M from './js/music.js';
import * as L from './js/levels.js';
import * as S from './js/stats.js';
import * as C from './js/chords.js';
import * as P from './js/pitch.js';

const results = [];
const eq = (label, got, want) => results.push([label, JSON.stringify(got) === JSON.stringify(want), got, want]);
const n = M.note;
const [DO, RE, MI, FA, SOL, LA, SI] = [0, 1, 2, 3, 4, 5, 6];

// Positions sur la portée
eq('Sol : ligne du bas = Mi4', M.staffPos(n(MI, 4), 'sol'), -4);
eq('Sol : ligne du haut = Fa5', M.staffPos(n(FA, 5), 'sol'), 4);
eq('Sol : 2e ligne = Sol4', M.staffPos(n(SOL, 4), 'sol'), -2);
eq('Fa : ligne du haut = La3', M.staffPos(n(LA, 3), 'fa'), 4);
eq('Fa : ligne du bas = Sol2', M.staffPos(n(SOL, 2), 'fa'), -4);
eq('Fa : 4e ligne = Fa3', M.staffPos(n(FA, 3), 'fa'), 2);
eq('Do4 en sol : 1 ligne supp. dessous', M.ledgerLines(M.staffPos(n(DO, 4), 'sol')), [-6]);
eq('Do4 en fa : 1 ligne supp. dessus', M.ledgerLines(M.staffPos(n(DO, 4), 'fa')), [6]);
eq('Ré4 en sol : aucune ligne supp. (juste sous la portée)', M.ledgerLines(M.staffPos(n(RE, 4), 'sol')), []);
eq('Do6 en sol : 2 lignes supp.', M.ledgerLines(M.staffPos(n(DO, 6), 'sol')), [6, 8]);
eq('Mi2 en fa : sur la 1re ligne supp.', M.ledgerLines(M.staffPos(n(MI, 2), 'fa')), [-6]);
eq('Do2 en fa : 2 lignes supp.', M.ledgerLines(M.staffPos(n(DO, 2), 'fa')), [-6, -8]);

// Noms et hauteurs
eq('Nom Sol dièse', M.noteName(n(SOL, 4, 1)), 'Sol dièse');
eq('Nom Si bémol', M.noteName(n(SI, 3, -1)), 'Si bémol');
eq('Ré♯ et Mi♭ même touche', M.pitchClass(n(RE, 4, 1)), M.pitchClass(n(MI, 4, -1)));
eq('Do4 = MIDI 60', M.midi(n(DO, 4)), 60);
eq('La4 = MIDI 69', M.midi(n(LA, 4)), 69);
eq('Mi♯ ambigu', M.isAmbiguous(n(MI, 4, 1)), true);
eq('Fa♯ non ambigu', M.isAmbiguous(n(FA, 4, 1)), false);
eq('Clé aller-retour', M.parseKey(M.noteKey('fa', n(SI, 2, -1))), { clef: 'fa', note: n(SI, 2, -1) });

// Niveaux
eq('Niveau 1 : 9 notes (Mi4 à Fa5)', L.buildPool(L.LEVELS[0]).length, 9);
eq('Niveau 6 : pas de Mi♯ ni Si♯', L.buildPool(L.LEVELS[5]).some((p) => M.isAmbiguous(p.note)), false);
eq('Niveau 9 : Do4 sur les deux portées', L.buildPool(L.LEVELS[8]).filter((p) => M.diatonic(p.note) === 28).map((p) => p.clef).sort(), ['fa', 'sol']);
eq('Étoiles : 80 % = 0', L.starsFor(0.8, 1000, 8), 0);
eq('Étoiles : 90 % = 1', L.starsFor(0.9, 1000, 8), 1);
eq('Étoiles : 100 % lent = 2', L.starsFor(1, 5000, 8), 2);
eq('Étoiles : 100 % rapide = 3', L.starsFor(1, 2000, 8), 3);
eq('Niveau 2 verrouillé au départ', L.isUnlocked(L.LEVELS[1], L.LEVELS, {}), false);
eq('Niveau 2 ouvert après 1 étoile au 1', L.isUnlocked(L.LEVELS[1], L.LEVELS, { 1: { stars: 1 } }), true);
eq('Accords : niveau 1 ouvert', L.isUnlocked(L.CHORD_LEVELS[0], L.CHORD_LEVELS, {}), true);
eq('Accords : niveau 2 ouvert après c1', L.isUnlocked(L.CHORD_LEVELS[1], L.CHORD_LEVELS, { c1: { stars: 2 } }), true);

// Accords
const names = (ns) => ns.map(M.shortName).join(' ');
eq('Do majeur = Do Mi Sol', names(C.spellChord(n(DO, 4), 'maj')), 'Do Mi Sol');
eq('Ré mineur = Ré Fa La', names(C.spellChord(n(RE, 4), 'min')), 'Ré Fa La');
eq('Si majeur = Si Ré♯ Fa♯', names(C.spellChord(n(SI, 3), 'maj')), 'Si Ré♯ Fa♯');
eq('La♭ mineur = La♭ Do♭ Mi♭', names(C.spellChord(n(LA, 4, -1), 'min')), 'La♭ Do♭ Mi♭');
eq('Sol 7 = Sol Si Ré Fa', names(C.spellChord(n(SOL, 4), 'dom7')), 'Sol Si Ré Fa');
eq('Do maj7 = Do Mi Sol Si', names(C.spellChord(n(DO, 4), 'maj7')), 'Do Mi Sol Si');
eq('La m7 = La Do Mi Sol', names(C.spellChord(n(LA, 4), 'min7')), 'La Do Mi Sol');
eq('Do majeur 1er renv. : Mi à la basse', names(C.voiceChord({ letter: DO, acc: 0 }, 'maj', 1, 'sol')), 'Mi Sol Do');
eq('Do majeur 2e renv. : Sol à la basse', names(C.voiceChord({ letter: DO, acc: 0 }, 'maj', 2, 'sol')), 'Sol Do Mi');
eq('Sol 7 3e renv. : Fa à la basse', names(C.voiceChord({ letter: SOL, acc: 0 }, 'dom7', 3, 'fa')), 'Fa Sol Si Ré');
eq('Pas de 3e renversement pour une triade', C.voiceChord({ letter: DO, acc: 0 }, 'maj', 3, 'sol'), null);
eq('Nom : Si bémol maj7', C.chordName({ root: { letter: SI, acc: -1 }, quality: 'maj7' }), 'Si bémol maj7');
eq('Abrégé : Rém', C.chordShort({ root: { letter: RE, acc: 0 }, quality: 'min' }), 'Rém');
const allChords = L.CHORD_LEVELS.flatMap((lvl) => L.buildPool(lvl));
eq('Aucune double altération', allChords.some((c) => c.chord.some((x) => Math.abs(x.acc) > 1)), false);
eq('Basse dans le registre (sol : Do4–Si4, fa : Mi2–Ré3)',
  allChords.every((c) => { const b = M.diatonic(c.chord[0]) - C.CHORD_BASS[c.clef]; return b >= 0 && b < 7; }), true);
eq('Clé d’accord aller-retour', C.parseChordKey('ch:fa:6:-1:min7:2').key, 'ch:fa:6:-1:min7:2');
eq('Mode libre « les deux » : notes et accords',
  [...new Set(L.buildPool(L.freeLevel({ content: 'both', clefs: 'sol', accs: 'none', chordTypes: 'all', time: 8 })).map((p) => p.kind))].sort(), ['chord', 'note']);

// Statistiques
const stats = {};
S.recordAnswer(stats, 'sol:30:0', false, 3000);
S.recordAnswer(stats, 'sol:30:0', true, 2000);
S.recordAnswer(stats, 'sol:31:0', true, 1000);
eq('Note ratée plus lourde', S.weightFor(stats['sol:30:0'], 8000) > S.weightFor(stats['sol:31:0'], 8000), true);
eq('Notes difficiles', S.hardest(stats), ['sol:30:0']);
const pool = L.buildPool(L.LEVELS[0]);
const prev = pool[0].key;
eq('Pas deux fois la même note', Array.from({ length: 200 }, () => S.pickWeighted(pool, {}, prev, 0)).some((p) => p.key === prev), false);
eq('Notes difficiles filtrées par type', S.hardest({ ...stats, 'ch:sol:0:0:maj:0': { n: 1, e: 1, t: 0, r: [1] } }, 10, C.isChordKey), ['ch:sol:0:0:maj:0']);

// Détection de hauteur sur des sons de piano synthétiques
// (8 harmoniques légèrement inharmoniques, amortissement, bruit optionnel ; fondamentale faible dans le grave).
function pianoTone(midiNote, { sr = 48000, n = 2048, noise = 0, weakFundamental = false, seed = 1 } = {}) {
  const f = P.midiToFreq(midiNote);
  const buf = new Float32Array(n);
  let r = seed;
  const rand = () => ((r = (r * 16807) % 2147483647) / 2147483647) * 2 - 1;
  for (let k = 1; k <= 8; k++) {
    const fk = f * k * Math.sqrt(1 + 0.0004 * k * k);
    if (fk > sr / 2) break;
    const amp = (k === 1 && weakFundamental ? 0.25 : 1) / k;
    const ph = k * 0.7;
    for (let i = 0; i < n; i++) buf[i] += amp * Math.sin(2 * Math.PI * fk * i / sr + ph) * Math.exp(-i / sr * 3);
  }
  for (let i = 0; i < n; i++) buf[i] = buf[i] * 0.2 + noise * rand();
  return buf;
}
const detect = (buf) => { const r = P.yin(buf, 48000); return r && P.nearestNote(r.freq).midi; };
const range = Array.from({ length: 49 }, (_, i) => 36 + i); // Do2 (36) à Do6 (84)
const wrong = (opts) => range.filter((m) => detect(pianoTone(m, opts)) !== m);
eq('Micro : Do2 à Do6 reconnus', wrong({}), []);
eq('Micro : avec bruit de fond', wrong({ noise: 0.01 }), []);
eq('Micro : fondamentale faible (grave)', wrong({ weakFundamental: true }), []);
eq('Micro : La 440 = MIDI 69, 0 cent', P.nearestNote(440), { midi: 69, cents: 0 });
eq('Micro : piano 20 cents trop haut, compensé', P.nearestNote(440 * 2 ** (20 / 1200), 20), { midi: 69, cents: 0 });
eq('Micro : silence → rien', P.yin(new Float32Array(2048), 48000), null);
let seed = 42;
const whiteNoise = Float32Array.from({ length: 2048 }, () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1);
eq('Micro : bruit pur → rien', P.yin(whiteNoise, 48000), null);

const out = document.getElementById('out');
for (const [label, ok, got, want] of results) {
  const li = document.createElement('li');
  li.className = ok ? 'ok' : 'ko';
  li.textContent = ok ? `✓ ${label}` : `✗ ${label} — obtenu ${JSON.stringify(got)}, attendu ${JSON.stringify(want)}`;
  out.append(li);
}
const failed = results.filter((r) => !r[1]).length;
document.getElementById('sum').textContent = failed ? `${failed} échec(s) sur ${results.length}` : `${results.length} tests OK`;
</script>
</body>
</html>
